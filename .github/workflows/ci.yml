name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # `npm test` excludes test/retrieval-eval/; this step runs it once. Retrieval floors (test/retrieval-eval/baseline.json): fails if answer@1, archive hits or link scores regress
      - run: npm run eval

  smoke:
    # Fresh-install smoke test — mechanically prevents the v1.1.0-class packaging bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/smoke-install.sh
